services:
  - type: web
    name: ai-builder-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: APP_NAME
        value: "AI Builder"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://api.ai-landing-page.xyz
      - key: PLATFORM_DOMAIN
        value: api.ai-landing-page.xyz
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: AWS_REGION
        value: eu-central-1
      - key: AWS_BUCKET
        value: assets
      - key: HOSTING_DISK
        value: s3
      - key: DATABASE_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
